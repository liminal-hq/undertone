[package]
name = "r3-bridge"
description = "Throwaway spike R3: loading and the bridge skeleton"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Its own workspace: the root workspace (`members = ["crates/*"]`) never sees this crate.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
undertone-pattern = { path = "../../crates/undertone-pattern" }
undertone-engine = { path = "../../crates/undertone-engine" }
wasm-bindgen = "=0.2.125"
js-sys = "=0.3.102"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
