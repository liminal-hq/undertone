[package]
name = "r4-worklet"
description = "Throwaway spike R4: a minimal worklet module (raw C ABI) for the size budget"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
default = ["pattern", "mini"]
# Build and query pattern trees in the worklet (RF-29 may leave booking to a worker or the main thread, so the worklet would carry no pattern core).
pattern = []
# Parse mini-notation and scale text in the worklet (a worklet that is given a built tree needs neither).
mini = ["pattern"]

[dependencies]
undertone-pattern = { path = "../../../crates/undertone-pattern" }
undertone-engine = { path = "../../../crates/undertone-engine" }
