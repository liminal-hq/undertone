name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Jobs run in the shared images from liminal-hq/.github (public), pinned by digest.
# The digests come from docs/reference/recommended-image-pins.md there (last updated 2026-11-10); bump them on purpose.
#   ci-web:  Node 24.22.2, pnpm 10.32.1, Bun 1.4.4 (satisfies package.json engines: node >=20, bun >=1.2)
#   ci-rust: Rust 1.98.0 (matches rust-toolchain.toml), rustfmt, Clippy, cargo-nextest, cargo-deny, git, jq; no wasm32 target, no Node

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/liminal-hq/ci-web@sha256:43db6bd804c801fda46586e6978407240dc5dd3509f85482a29d71ab87e49b5d
    steps:
      - uses: actions/checkout@v7
      - run: bun install --frozen-lockfile
      - name: Build library
        run: bun run build
      - name: Write summary
        if: always()
        run: echo "## Build" >> "${GITHUB_STEP_SUMMARY}"

  test:
    name: Test
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/liminal-hq/ci-web@sha256:43db6bd804c801fda46586e6978407240dc5dd3509f85482a29d71ab87e49b5d
    steps:
      - uses: actions/checkout@v7
      - run: bun install --frozen-lockfile
      - name: Run tests
        run: bun run test:ci
      - name: Upload frontend test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-test-results
          path: test-results/junit.xml
          if-no-files-found: ignore
      - name: Upload the event file
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: event-file
          path: ${{ github.event_path }}
      - name: Write summary
        if: always()
        run: echo "## Test" >> "${GITHUB_STEP_SUMMARY}"

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/liminal-hq/ci-web@sha256:43db6bd804c801fda46586e6978407240dc5dd3509f85482a29d71ab87e49b5d
    steps:
      - uses: actions/checkout@v7
      - run: bun install --frozen-lockfile
      - name: ESLint
        run: bun run lint
      - name: Write summary
        if: always()
        run: echo "## Lint" >> "${GITHUB_STEP_SUMMARY}"

  format:
    name: Format
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/liminal-hq/ci-web@sha256:43db6bd804c801fda46586e6978407240dc5dd3509f85482a29d71ab87e49b5d
    steps:
      - uses: actions/checkout@v7
      - run: bun install --frozen-lockfile
      - name: Prettier check
        run: bun run format:check
      - name: Write summary
        if: always()
        run: echo "## Format" >> "${GITHUB_STEP_SUMMARY}"

  # Renders the audio the TypeScript guide pages play (scripts/render-ts-audio.ts) and hands it to the docs job. node-web-audio-api needs
  # libasound.so.2, which the ci-web image lacks (liminal-hq/.github issue #54 asks for it); drop the install step once the pinned image has it.
  docs-audio:
    name: Docs audio (render)
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/liminal-hq/ci-web@sha256:43db6bd804c801fda46586e6978407240dc5dd3509f85482a29d71ab87e49b5d
    steps:
      - uses: actions/checkout@v7
      - name: Install libasound2t64 where it is missing
        run: ldconfig -p | grep -q 'libasound.so.2' || (apt-get update && apt-get install -y --no-install-recommends libasound2t64)
      - run: bun install --frozen-lockfile
      - name: Render the example audio
        run: bun run docs:audio target/ts-audio
      - name: Upload the example audio
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ts-audio
          path: target/ts-audio
          if-no-files-found: error
          retention-days: 1
      - name: Write summary
        if: always()
        run: echo "## Docs audio" >> "${GITHUB_STEP_SUMMARY}"

  docs:
    name: Docs (build + typecheck)
    needs: [rust-doc, docs-audio, wasm-bridge]
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/liminal-hq/ci-web@sha256:43db6bd804c801fda46586e6978407240dc5dd3509f85482a29d71ab87e49b5d
    steps:
      - uses: actions/checkout@v7
      - run: bun install --frozen-lockfile
      - name: Typecheck docs theme
        run: bun run typecheck:docs
      - name: Download Rust API docs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rustdoc
          path: docs/public/rust
      - name: Download the example audio
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-audio
          path: docs/public/rust-audio
      - name: Download the TypeScript example audio
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ts-audio
          path: docs/public/ts-audio
      # TypeDoc documents the bridge package (typedoc.json), whose sources import the modules' generated glue.
      - name: Download the modules and their glue
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-module
          path: packages/undertone/wasm
      - name: Test the audio check
        run: bash scripts/check-ts-audio.test.sh
      - name: Check the audio
        run: bash scripts/check-ts-audio.sh
      - name: Test the Rust guide check
        run: bash scripts/check-rust-docs.test.sh
      - name: Check the Rust guide
        run: bash scripts/check-rust-docs.sh
      - name: Build docs site
        run: bun run docs:build
      - name: Write summary
        if: always()
        run: echo "## Docs" >> "${GITHUB_STEP_SUMMARY}"

  api:
    name: API report
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/liminal-hq/ci-web@sha256:43db6bd804c801fda46586e6978407240dc5dd3509f85482a29d71ab87e49b5d
    steps:
      - uses: actions/checkout@v7
      - run: bun install --frozen-lockfile
      - name: Check the public API report
        run: bun run api:check
      - name: Write summary
        if: always()
        run: echo "## API report" >> "${GITHUB_STEP_SUMMARY}"

  conformance:
    name: Conformance corpus
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/liminal-hq/ci-web@sha256:43db6bd804c801fda46586e6978407240dc5dd3509f85482a29d71ab87e49b5d
    steps:
      - uses: actions/checkout@v7
      - run: bun install --frozen-lockfile
      - name: Check the corpus is current
        run: bun run conformance:check
      - name: Write summary
        if: always()
        run: echo "## Conformance corpus" >> "${GITHUB_STEP_SUMMARY}"

  test-classes:
    name: Test classification
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/liminal-hq/ci-web@sha256:43db6bd804c801fda46586e6978407240dc5dd3509f85482a29d71ab87e49b5d
    steps:
      - uses: actions/checkout@v7
      - run: bun install --frozen-lockfile
      - name: Check every test is classified
        run: bun run test-classes:check
      - name: Write summary
        if: always()
        run: echo "## Test classification" >> "${GITHUB_STEP_SUMMARY}"

  voice-params:
    name: VoiceParams names
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/liminal-hq/ci-web@sha256:43db6bd804c801fda46586e6978407240dc5dd3509f85482a29d71ab87e49b5d
    steps:
      - uses: actions/checkout@v7
      - run: bun install --frozen-lockfile
      - name: Check the VoiceParams field list is current
        run: bun run voice-params:check
      - name: Write summary
        if: always()
        run: echo "## VoiceParams names" >> "${GITHUB_STEP_SUMMARY}"

  rust-fmt:
    name: Rust format
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:0ef31efa5876407765cd5572a23323932183a5357eaac92eee67d79657d45c02
    steps:
      - uses: actions/checkout@v7
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Write summary
        if: always()
        run: echo "## Rust format" >> "${GITHUB_STEP_SUMMARY}"

  rust-clippy:
    name: Rust Clippy
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:0ef31efa5876407765cd5572a23323932183a5357eaac92eee67d79657d45c02
    steps:
      - uses: actions/checkout@v7
      - name: Install the ALSA development files where they are missing
        run: bash scripts/install-native-prereqs.sh
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Write summary
        if: always()
        run: echo "## Rust Clippy" >> "${GITHUB_STEP_SUMMARY}"

  rust-test:
    name: Rust tests
    runs-on: ubuntu-24.04
    env:
      # The property tests run 1,000 cases per property on pull requests and the full 10,000 on pushes to main.
      PROPTEST_CASES: ${{ github.event_name == 'pull_request' && '1000' || '10000' }}
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:0ef31efa5876407765cd5572a23323932183a5357eaac92eee67d79657d45c02
    steps:
      - uses: actions/checkout@v7
      - name: Install the ALSA development files where they are missing
        run: bash scripts/install-native-prereqs.sh
      - name: Run tests
        run: cargo nextest run --workspace --locked --profile ci
      - name: Run tests with the C library maths
        # The real C library back-end on x86-64 with glibc, where R9 measured it. UNDERTONE_EXPECT_MATHS makes a test fail if feature unification switches `libm` back on.
        run: |
          UNDERTONE_EXPECT_MATHS=native cargo nextest run -p undertone-engine --no-default-features --locked
          UNDERTONE_EXPECT_MATHS=native cargo nextest run -p undertone --no-default-features --locked
          UNDERTONE_EXPECT_MATHS=std cargo nextest run -p undertone-pattern --no-default-features --locked
      - name: Upload Rust test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-test-results
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
      - name: Write summary
        if: always()
        run: echo "## Rust tests" >> "${GITHUB_STEP_SUMMARY}"

  rust-doc:
    name: Rust docs (doc tests + cargo doc)
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:0ef31efa5876407765cd5572a23323932183a5357eaac92eee67d79657d45c02
    steps:
      - uses: actions/checkout@v7
      - name: Install the ALSA development files where they are missing
        run: bash scripts/install-native-prereqs.sh
      - name: Doc tests
        run: cargo test --doc --workspace --locked
      - name: Build API docs
        run: bash scripts/build-rust-docs.sh
      # The docs job builds the site with this output beside it, so a broken link to the rustdoc fails the pull request.
      - name: Upload Rust API docs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rustdoc
          path: target/doc
          if-no-files-found: error
          retention-days: 1
      - name: Render the example audio
        run: bash scripts/render-rust-audio.sh target/rust-audio
      - name: Upload the example audio
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-audio
          path: target/rust-audio
          if-no-files-found: error
          retention-days: 1
      - name: Write summary
        if: always()
        run: echo "## Rust docs" >> "${GITHUB_STEP_SUMMARY}"

  rust-deny:
    name: Rust dependencies (cargo deny)
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:0ef31efa5876407765cd5572a23323932183a5357eaac92eee67d79657d45c02
    steps:
      - uses: actions/checkout@v7
      - name: Check licences, bans, sources, and advisories
        run: cargo deny check licenses bans sources advisories
      - name: Write summary
        if: always()
        run: echo "## Rust dependencies" >> "${GITHUB_STEP_SUMMARY}"

  rust-arm64:
    name: Rust tests (ARM64)
    runs-on: ubuntu-24.04-arm
    env:
      # The property tests run 1,000 cases per property on pull requests and the full 10,000 on pushes to main.
      PROPTEST_CASES: ${{ github.event_name == 'pull_request' && '1000' || '10000' }}
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:0ef31efa5876407765cd5572a23323932183a5357eaac92eee67d79657d45c02
    steps:
      - uses: actions/checkout@v7
      - name: Install the ALSA development files where they are missing
        run: bash scripts/install-native-prereqs.sh
      - name: Run tests
        run: cargo nextest run --workspace --locked
      - name: Run tests with the C library maths
        # UNDERTONE_EXPECT_MATHS makes a test fail if feature unification switches `libm` back on.
        run: |
          UNDERTONE_EXPECT_MATHS=native cargo nextest run -p undertone-engine --no-default-features --locked
          UNDERTONE_EXPECT_MATHS=native cargo nextest run -p undertone --no-default-features --locked
          UNDERTONE_EXPECT_MATHS=std cargo nextest run -p undertone-pattern --no-default-features --locked
      - name: Write summary
        if: always()
        run: echo "## Rust tests (ARM64)" >> "${GITHUB_STEP_SUMMARY}"

  # The native output (RF-28, D-49), on x86-64 and ARM64: the crate on its own, with the default `cpal` feature (which needs the ALSA
  # development files, installed where missing) and with it off (the `Sink` seam alone, which a host with its own audio callback uses).
  # No sound card is expected in the container: the device tests say so and pass. The ten-minute underrun soak runs by hand
  # (`cargo run -p undertone-native --example play -- --soak-seconds 600 --busy-threads N`), not here. FreeBSD is not built: cpal's
  # output paths there are unverified (an open question on the pull request).
  rust-native:
    name: Rust native output (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: ubuntu-24.04
          - arch: ARM64
            runner: ubuntu-24.04-arm
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:0ef31efa5876407765cd5572a23323932183a5357eaac92eee67d79657d45c02
    steps:
      - uses: actions/checkout@v7
      - name: Install the ALSA development files where they are missing
        run: bash scripts/install-native-prereqs.sh
      - name: Clippy, with cpal and without
        run: |
          cargo clippy -p undertone-native --all-targets --locked -- -D warnings
          cargo clippy -p undertone-native --all-targets --no-default-features --locked -- -D warnings
      - name: Tests, with cpal and without
        run: |
          cargo nextest run -p undertone-native --locked
          cargo nextest run -p undertone-native --no-default-features --locked
      - name: Write summary
        if: always()
        run: echo "## Rust native output (${{ matrix.arch }})" >> "${GITHUB_STEP_SUMMARY}"

  rust-freebsd:
    name: Rust FreeBSD build
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:0ef31efa5876407765cd5572a23323932183a5357eaac92eee67d79657d45c02
    steps:
      - uses: actions/checkout@v7
      - name: Add the FreeBSD target
        run: rustup target add x86_64-unknown-freebsd
      - name: Check the crates for FreeBSD
        run: cargo check --locked --target x86_64-unknown-freebsd -p undertone-pattern -p undertone-engine
      - name: Write summary
        if: always()
        run: echo "## Rust FreeBSD build" >> "${GITHUB_STEP_SUMMARY}"

  rust-wasm:
    name: Rust WebAssembly build
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:0ef31efa5876407765cd5572a23323932183a5357eaac92eee67d79657d45c02
    steps:
      - uses: actions/checkout@v7
      - name: Add the wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Build for wasm32
        run: cargo build --locked --target wasm32-unknown-unknown -p undertone-pattern -p undertone-engine -p undertone-sched -p undertone
      - name: Write summary
        if: always()
        run: echo "## Rust WebAssembly" >> "${GITHUB_STEP_SUMMARY}"

  # The WebAssembly bridge (RF-24, D-41), both modules (the main module and the lazily loaded render module): the shared ci-rust image plus the tools the job installs itself, each pinned and checked
  # against its SHA-256 (the GitHub release digests): the wasm32 target, the wasm-bindgen CLI that crates/undertone-wasm pins
  # (a prebuilt release binary; `cargo install` from source took 35 s with four jobs and a warm registry on a fast machine), and
  # Bun (ci-rust has no JavaScript runtime). wasm-opt comes from the binaryen npm package that scripts/wasm-opt/ locks. Switch to
  # the lighter wasm tier of liminal-hq/.github issue #52 when it lands.
  wasm-bridge:
    name: WebAssembly bridge
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:0ef31efa5876407765cd5572a23323932183a5357eaac92eee67d79657d45c02
    env:
      WASM_BINDGEN_VERSION: 0.2.125
      WASM_BINDGEN_SHA256: 21d81ef7414a0a585861a60ea4ae2b7970eccaed09d4a4e05f8bc4b159827dea
      BUN_VERSION: 1.4.4
      BUN_SHA256: bf8ccbfb2b0b80159e0f9a6d15c55317add8077534dbc6130a3edb52fccb395c
    steps:
      - uses: actions/checkout@v7
      - name: Add the wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Install the wasm-bindgen CLI
        run: |
          name="wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL -o "/tmp/${name}.tar.gz" "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/${name}.tar.gz"
          echo "${WASM_BINDGEN_SHA256}  /tmp/${name}.tar.gz" | sha256sum -c -
          tar -xzf "/tmp/${name}.tar.gz" -C /tmp
          install -m 755 "/tmp/${name}/wasm-bindgen" /usr/local/bin/wasm-bindgen
          wasm-bindgen --version
      - name: Install Bun
        run: |
          curl -fsSL -o /tmp/bun-linux-x64.zip "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
          echo "${BUN_SHA256}  /tmp/bun-linux-x64.zip" | sha256sum -c -
          unzip -q /tmp/bun-linux-x64.zip -d /tmp
          install -m 755 /tmp/bun-linux-x64/bun /usr/local/bin/bun
          bun --version
      - name: Clippy for wasm32
        run: cargo clippy -p undertone-wasm -p undertone-wasm-render --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Build the two modules
        run: bash scripts/build-wasm.sh
      - name: Check the size budgets
        run: bun scripts/check-wasm-size.ts
      - name: Smoke test
        run: bun crates/undertone-wasm/tests/js/smoke.ts
      - name: Corpus layer 1
        run: bun crates/undertone-wasm/tests/js/layer1.ts
      - name: Corpus layer 2
        run: bun crates/undertone-wasm/tests/js/layer2.ts
      - name: Booking, scheduler, samples, and render exports against the reference
        run: bun crates/undertone-wasm/tests/js/booking.ts
      - name: Corpus layer 3 (booked, replayed on the fake context)
        run: bun crates/undertone-wasm/tests/js/layer3.ts
      - name: Corpus layer 4 (the render module against Chromium's summaries)
        run: bun crates/undertone-wasm/tests/js/layer4.ts
      - name: WAV corpus (the render module)
        run: bun crates/undertone-wasm/tests/js/wav.ts
      - name: Upload the two modules and their glue
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-module
          path: |
            packages/undertone/wasm/undertone_wasm*
            packages/undertone/wasm/render/undertone_wasm_render*
          if-no-files-found: error
          retention-days: 1
      - name: Write summary
        if: always()
        run: echo "## WebAssembly bridge" >> "${GITHUB_STEP_SUMMARY}"

  # The bridge package (RF-25): the TypeScript over the module the wasm-bridge job built (ci-rust has no Node; ci-web has no
  # wasm32 target). Builds the package, runs its tests, compares its exports with the 0.4.0 API report (conformance/api/
  # package-pending.txt lists the accepted differences), and loads the packed tarball in Node, Bun, and Vite 5, a render included
  # (scripts/check-package-loading.sh). The package tests run corpus layers 1 to 4 and the WAV corpus through the package.
  bridge-package:
    name: Bridge package
    needs: [wasm-bridge]
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/liminal-hq/ci-web@sha256:43db6bd804c801fda46586e6978407240dc5dd3509f85482a29d71ab87e49b5d
    steps:
      - uses: actions/checkout@v7
      - run: bun install --frozen-lockfile
      - name: Download the module and its glue
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-module
          path: packages/undertone/wasm
      - name: Build the package
        run: bun run --cwd packages/undertone build
      - name: Package tests
        run: bun run package:test
      - name: Compare the exports with the API report
        run: bun run package:api
      - name: Check loading from the packed tarball
        run: bash scripts/check-package-loading.sh
      - name: Write summary
        if: always()
        run: echo "## Bridge package" >> "${GITHUB_STEP_SUMMARY}"

  # Rendering with no browser (RF-30): the `undertone-render` command line built natively and for wasm32-wasip1, run under wasmtime, and
  # the two renders compared byte for byte (scripts/check-wasi-render.sh). The native WAV files are uploaded as the reference for the
  # next job. wasmtime is a prebuilt release checked against its SHA-256 (the GitHub release digest); ci-rust has no wasm32 target.
  rust-wasi-render:
    name: Render under WASI
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:0ef31efa5876407765cd5572a23323932183a5357eaac92eee67d79657d45c02
    env:
      WASMTIME_VERSION: 51.0.0
      WASMTIME_SHA256: a18020674fac4107f329bc9ed720ea9c88e4b30a61e8a527787bcce051123d32
    steps:
      - uses: actions/checkout@v7
      - name: Add the WASI target
        run: rustup target add wasm32-wasip1
      - name: Install wasmtime
        run: |
          name="wasmtime-v${WASMTIME_VERSION}-x86_64-linux"
          curl -fsSL -o "/tmp/${name}.tar.xz" "https://github.com/bytecodealliance/wasmtime/releases/download/v${WASMTIME_VERSION}/${name}.tar.xz"
          echo "${WASMTIME_SHA256}  /tmp/${name}.tar.xz" | sha256sum -c -
          tar -xJf "/tmp/${name}.tar.xz" -C /tmp
          install -m 755 "/tmp/${name}/wasmtime" /usr/local/bin/wasmtime
          wasmtime --version
      - name: Render natively and under wasmtime, and compare the bytes
        run: bash scripts/check-wasi-render.sh target/render-reference
      - name: Upload the native renders
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-reference
          path: target/render-reference/*.wav
          if-no-files-found: error
          retention-days: 1
      - name: Write summary
        if: always()
        run: echo "## Render under WASI" >> "${GITHUB_STEP_SUMMARY}"

  # The same renders through the package in Node and Bun (what ci-web has) and Deno (a prebuilt release checked against its SHA-256), with
  # no Web Audio, compared with the native files byte for byte (scripts/check-package-render.sh). All three runtimes are required here.
  # ci-web carries Node 24, so Node 22 (the package's floor) is not run in CI.
  render-without-browser:
    name: Render without a browser
    needs: [wasm-bridge, rust-wasi-render]
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/liminal-hq/ci-web@sha256:43db6bd804c801fda46586e6978407240dc5dd3509f85482a29d71ab87e49b5d
    env:
      DENO_VERSION: 2.9.8
      DENO_SHA256: e890975bc2549807bbcc0b584ffafda72cc7c93349dd99c80483dd784f6c4609
    steps:
      - uses: actions/checkout@v7
      - run: bun install --frozen-lockfile
      - name: Install Deno
        run: |
          curl -fsSL -o /tmp/deno.zip "https://github.com/denoland/deno/releases/download/v${DENO_VERSION}/deno-x86_64-unknown-linux-gnu.zip"
          echo "${DENO_SHA256}  /tmp/deno.zip" | sha256sum -c -
          unzip -q /tmp/deno.zip -d /tmp
          install -m 755 /tmp/deno /usr/local/bin/deno
          deno --version
      - name: Download the module and its glue
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-module
          path: packages/undertone/wasm
      - name: Download the native renders
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: render-reference
          path: target/render-reference
      - name: Build the package
        run: bun run --cwd packages/undertone build
      - name: Render in Node, Bun, and Deno and compare with the native files
        run: REQUIRE_RUNTIMES="node bun deno" bash scripts/check-package-render.sh target/render-reference
      - name: Write summary
        if: always()
        run: echo "## Render without a browser" >> "${GITHUB_STEP_SUMMARY}"

  rust-layering:
    name: Rust crate layering
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:0ef31efa5876407765cd5572a23323932183a5357eaac92eee67d79657d45c02
    steps:
      - uses: actions/checkout@v7
      - name: Check crate layering
        run: scripts/check-layering.sh
      - name: Write summary
        if: always()
        run: echo "## Rust layering" >> "${GITHUB_STEP_SUMMARY}"
