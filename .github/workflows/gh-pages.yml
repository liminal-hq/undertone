name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The Rust API docs are built in the shared Rust CI image (the digest is the one ci.yml pins) and handed to the site build.
  rustdoc:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:0ef31efa5876407765cd5572a23323932183a5357eaac92eee67d79657d45c02
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build the Rust API docs
        run: bash scripts/build-rust-docs.sh

      - name: Upload the Rust API docs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rustdoc
          path: target/doc
          if-no-files-found: error
          retention-days: 1

      - name: Render the example audio
        run: bash scripts/render-rust-audio.sh target/rust-audio

      - name: Upload the example audio
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-audio
          path: target/rust-audio
          if-no-files-found: error
          retention-days: 1

  # TypeDoc documents the bridge package (typedoc.json), whose sources import the WebAssembly modules' generated glue, so the
  # modules are built here as ci.yml's wasm-bridge job builds them (the same image, pinned CLI, and Bun) and handed to the site build.
  wasm:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:0ef31efa5876407765cd5572a23323932183a5357eaac92eee67d79657d45c02
    env:
      WASM_BINDGEN_VERSION: 0.2.125
      WASM_BINDGEN_SHA256: 21d81ef7414a0a585861a60ea4ae2b7970eccaed09d4a4e05f8bc4b159827dea
      BUN_VERSION: 1.4.4
      BUN_SHA256: bf8ccbfb2b0b80159e0f9a6d15c55317add8077534dbc6130a3edb52fccb395c
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Add the wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install the wasm-bindgen CLI
        run: |
          name="wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL -o "/tmp/${name}.tar.gz" "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/${name}.tar.gz"
          echo "${WASM_BINDGEN_SHA256}  /tmp/${name}.tar.gz" | sha256sum -c -
          tar -xzf "/tmp/${name}.tar.gz" -C /tmp
          install -m 755 "/tmp/${name}/wasm-bindgen" /usr/local/bin/wasm-bindgen

      - name: Install Bun
        run: |
          curl -fsSL -o /tmp/bun-linux-x64.zip "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
          echo "${BUN_SHA256}  /tmp/bun-linux-x64.zip" | sha256sum -c -
          unzip -q /tmp/bun-linux-x64.zip -d /tmp
          install -m 755 /tmp/bun-linux-x64/bun /usr/local/bin/bun

      - name: Build the two modules
        run: bash scripts/build-wasm.sh

      - name: Upload the two modules and their glue
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-module
          path: |
            packages/undertone/wasm/undertone_wasm*
            packages/undertone/wasm/render/undertone_wasm_render*
          if-no-files-found: error
          retention-days: 1

  # The audio the TypeScript guide pages play is rendered in the shared web CI image and handed to the site build. node-web-audio-api needs
  # libasound.so.2, which the image lacks (liminal-hq/.github issue #54); drop the install step once the pinned image has it.
  ts-audio:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/liminal-hq/ci-web@sha256:43db6bd804c801fda46586e6978407240dc5dd3509f85482a29d71ab87e49b5d
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install libasound2t64 where it is missing
        run: ldconfig -p | grep -q 'libasound.so.2' || (apt-get update && apt-get install -y --no-install-recommends libasound2t64)

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Render the example audio
        run: bun run docs:audio target/ts-audio

      - name: Upload the example audio
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ts-audio
          path: target/ts-audio
          if-no-files-found: error
          retention-days: 1

  build:
    needs: [rustdoc, ts-audio, wasm]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Download the Rust API docs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rustdoc
          path: docs/public/rust

      - name: Download the example audio
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-audio
          path: docs/public/rust-audio
      - name: Download the TypeScript example audio
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ts-audio
          path: docs/public/ts-audio

      - name: Download the modules and their glue
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-module
          path: packages/undertone/wasm

      - name: Check the audio
        run: bash scripts/check-ts-audio.sh

      - name: Check the Rust guide
        run: bash scripts/check-rust-docs.sh

      - name: Build the docs site
        run: bun run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    runs-on: ubuntu-24.04
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
