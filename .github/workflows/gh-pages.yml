name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The Rust API docs are built in the shared Rust CI image (the digest is the one ci.yml pins) and handed to the site build.
  rustdoc:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:0ef31efa5876407765cd5572a23323932183a5357eaac92eee67d79657d45c02
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build the Rust API docs
        run: cargo doc --no-deps --workspace --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Upload the Rust API docs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rustdoc
          path: target/doc
          if-no-files-found: error
          retention-days: 1

      - name: Render the example audio
        run: bash scripts/render-rust-audio.sh target/rust-audio

      - name: Upload the example audio
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-audio
          path: target/rust-audio
          if-no-files-found: error
          retention-days: 1

  build:
    needs: rustdoc
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Download the Rust API docs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rustdoc
          path: docs/public/rust

      - name: Download the example audio
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-audio
          path: docs/public/rust-audio
      - name: Check the Rust guide
        run: bash scripts/check-rust-docs.sh

      - name: Build the docs site
        run: bun run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    runs-on: ubuntu-24.04
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
