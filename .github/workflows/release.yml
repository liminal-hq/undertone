name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag (must start with v). Defaults to v<package.json version>.
        required: false
        type: string
      release_draft:
        description: Create or keep this release as draft (skips the npm publish gate)
        required: false
        default: false
        type: boolean

concurrency:
  group: "release-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}"
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  prepare-release:
    name: Prepare release metadata
    runs-on: ubuntu-24.04
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      release_name: ${{ steps.meta.outputs.release_name }}
      release_id: ${{ steps.release.outputs.release_id }}
      release_draft: ${{ steps.release.outputs.release_draft }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve release tag
        id: meta
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            INPUT_TAG="${{ inputs.release_tag }}"
            if [[ -n "${INPUT_TAG}" ]]; then
              TAG="${INPUT_TAG}"
            else
              PACKAGE_VERSION="$(node -p "require('./package.json').version")"
              if [[ -z "${PACKAGE_VERSION}" ]]; then
                echo "Could not resolve version from package.json" >&2
                exit 1
              fi
              TAG="v${PACKAGE_VERSION}"
            fi
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${TAG}" =~ ^v.+$ ]]; then
            echo "Invalid release tag: ${TAG}" >&2
            echo "Expected a tag matching v*" >&2
            exit 1
          fi

          echo "tag_name=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "release_name=undertone ${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Create or reuse release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
          RELEASE_NAME: ${{ steps.meta.outputs.release_name }}
          MANUAL_RELEASE_DRAFT: ${{ inputs.release_draft }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            RELEASE_DRAFT="${MANUAL_RELEASE_DRAFT:-false}"
          else
            RELEASE_DRAFT="false"
          fi

          RELEASE_MATCH="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"${TAG_NAME}\") | [.id, .draft] | @tsv" \
              | head -n 1 || true
          )"

          if [[ -z "${RELEASE_MATCH}" ]]; then
            RELEASE_ID="$(
              gh api \
                --method POST \
                "repos/${GITHUB_REPOSITORY}/releases" \
                -f tag_name="${TAG_NAME}" \
                -f target_commitish="${GITHUB_SHA}" \
                -f name="${RELEASE_NAME}" \
                -f body='See assets below for the npm package tarball.' \
                -F generate_release_notes=true \
                -F draft="${RELEASE_DRAFT}" \
                -F prerelease=false \
                --jq '.id'
            )"
          else
            RELEASE_ID="$(awk '{print $1}' <<< "${RELEASE_MATCH}")"
            EXISTING_DRAFT="$(awk '{print $2}' <<< "${RELEASE_MATCH}")"

            if [[ "${EXISTING_DRAFT}" == "true" && "${RELEASE_DRAFT}" == "false" ]]; then
              gh api \
                --method PATCH \
                "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
                -F draft=false > /dev/null
            fi
          fi

          echo "release_id=${RELEASE_ID}" >> "${GITHUB_OUTPUT}"
          echo "release_draft=${RELEASE_DRAFT}" >> "${GITHUB_OUTPUT}"

  verify-and-build:
    name: Verify and build package
    runs-on: ubuntu-24.04
    needs: prepare-release
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Check tag matches package.json version
        if: github.event_name == 'push'
        env:
          TAG_NAME: ${{ needs.prepare-release.outputs.tag_name }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          if [[ "${TAG_NAME}" != "${EXPECTED_TAG}" ]]; then
            echo "Tag ${TAG_NAME} does not match package.json version ${PACKAGE_VERSION} (expected ${EXPECTED_TAG})" >&2
            exit 1
          fi

      - name: Build library
        run: bun run build
      - name: Run tests
        run: bun run test
      - name: ESLint
        run: bun run lint
      - name: Prettier check
        run: bun run format:check
      - name: Typecheck demo
        run: bun run typecheck:demo
      - name: Build demo
        run: bun run build:demo

      - name: Create npm package tarball
        run: npm pack

      - name: Upload package tarball
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: '*.tgz'
          if-no-files-found: error

  publish-release:
    name: Attach package to GitHub release
    runs-on: ubuntu-24.04
    needs: [prepare-release, verify-and-build]
    steps:
      - name: Download package tarball
        uses: actions/download-artifact@v5
        with:
          name: npm-package
          path: release-assets

      - name: Upload asset to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag_name }}
          files: release-assets/*.tgz
          fail_on_unmatched_files: true
          overwrite_files: true

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-24.04
    needs: [prepare-release, verify-and-build]
    if: needs.prepare-release.outputs.release_draft != 'true'
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download package tarball
        uses: actions/download-artifact@v5
        with:
          name: npm-package
          path: release-assets

      - uses: actions/setup-node@v5
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          TARBALL="$(find release-assets -maxdepth 1 -name '*.tgz' | head -n 1)"
          if [[ -z "${TARBALL}" ]]; then
            echo "No npm package tarball found in release-assets/" >&2
            exit 1
          fi
          npm publish "${TARBALL}" --access public --provenance

      - name: Write summary
        run: echo "## Published ${{ needs.prepare-release.outputs.tag_name }} to npm" >> "${GITHUB_STEP_SUMMARY}"
