[package]
name = "undertone-wasm"
description = "The WebAssembly build of Undertone's Rust API, through wasm-bindgen, that the npm package wraps"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# It ships inside the npm package (packages/undertone), never on crates.io (D-10).
publish = false

[lib]
# cdylib for the .wasm module; rlib so the native unit tests and `cargo check` on the host build it too.
crate-type = ["cdylib", "rlib"]

[dependencies]
undertone = { path = "../undertone", version = "0.0.0" }
# Pinned exactly: the `wasm-bindgen` CLI must be the same version (scripts/build-wasm.sh checks it). js-sys
# 0.3.102 is the release that pairs with it; part 2 adds web-sys =0.3.102 and wasm-bindgen-futures =0.4.75,
# the releases that pin wasm-bindgen =0.2.125.
wasm-bindgen = "=0.2.125"
js-sys = "=0.3.102"
# Values leave Rust as plain objects through serde-wasm-bindgen (D-11); serde_json never enters the module (R4).
serde = { version = "1", default-features = false, features = ["derive"] }
serde-wasm-bindgen = "0.6.5"

[dev-dependencies]
# TypeScript declarations for the plain-object types, generated by a unit test only, so ts-rs never enters the module (D-11).
ts-rs = "12.0.1"

[lints]
workspace = true
