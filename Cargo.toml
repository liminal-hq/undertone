[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/liminal-hq/undertone"
authors = ["Liminal HQ, Scott Morris"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.dev]
debug = "line-tables-only"

# The WebAssembly control module (`crates/undertone-wasm`, built by `scripts/build-wasm.sh` with `--profile wasm`):
# spike R4's size profile. "z" was 5% smaller than "s" after Brotli (R4). The `release` profile the native crates
# use is not changed by it.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# The worklet's build of the same render crate (`scripts/build-wasm.sh` builds it into `packages/undertone/wasm/worklet/`):
# the `wasm` profile with speed instead of size, because `process` has 2.9 ms to render 128 frames and the size build measured
# 41% of that on a desktop against the 40% limit, where this one measured 9% (M7-outputs.md). Only `undertone-wasm-render` is built with it.
[profile.wasm-fast]
inherits = "wasm"
opt-level = 3
