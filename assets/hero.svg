<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Undertone</title>
  <desc id="hero-desc">A procedural one-shot sound-effect synth for games. Dark banner with an animated triggered-envelope waveform and expanding ping rings.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080a12"/>
      <stop offset="55%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0a0f1c"/>
    </linearGradient>

    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="envelope-stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="12%" stop-color="#2dd4bf" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.15"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="text-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="318" rx="19" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- Ambient glow circles -->
  <g opacity="0.08">
    <circle cx="180" cy="270" r="170" fill="#c084fc"/>
    <circle cx="1020" cy="70" r="150" fill="#2dd4bf"/>
    <circle cx="640" cy="180" r="190" fill="#818cf8"/>
  </g>

  <!-- Wordmark -->
  <text x="80" y="140" font-family="'Fira Code','JetBrains Mono',ui-monospace,Menlo,monospace" font-size="72" font-weight="700" fill="url(#brand)" filter="url(#text-glow)" letter-spacing="-1">Undertone</text>
  <text x="84" y="176" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif" font-size="21" font-weight="500" fill="#94a3b8">Procedural one-shot sound effects for games</text>
  <text x="84" y="208" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#475569" letter-spacing="3">TYPESCRIPT&#160;&#160;&#183;&#160;&#160;ZERO DEPENDENCIES&#160;&#160;&#183;&#160;&#160;WEB AUDIO</text>

  <!-- Triggered envelope trace: attack / decay / release shape that flashes on each trigger -->
  <g filter="url(#glow)">
    <path fill="none" stroke="url(#envelope-stroke)" stroke-width="2.5"
      d="M780 230 L800 230 L818 92 L840 190 L862 170 L900 224 L960 230 L1140 230">
      <animate attributeName="opacity" values="0.15;1;0.15;0.15" keyTimes="0;0.08;0.4;1" dur="2.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Trigger point + expanding ping rings, staggered -->
  <g>
    <circle cx="818" cy="92" r="4" fill="#2dd4bf" opacity="0.9"/>
    <circle cx="818" cy="92" r="4" fill="none" stroke="#2dd4bf" stroke-width="2">
      <animate attributeName="r" values="4;70" dur="2.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.2 0 0.4 1"/>
      <animate attributeName="opacity" values="0.8;0" dur="2.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.2 0 0.4 1"/>
    </circle>
    <circle cx="818" cy="92" r="4" fill="none" stroke="#818cf8" stroke-width="2">
      <animate attributeName="r" values="4;70" dur="2.6s" begin="0.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.2 0 0.4 1"/>
      <animate attributeName="opacity" values="0.6;0" dur="2.6s" begin="0.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.2 0 0.4 1"/>
    </circle>
    <circle cx="818" cy="92" r="4" fill="none" stroke="#c084fc" stroke-width="1.5">
      <animate attributeName="r" values="4;70" dur="2.6s" begin="1s" repeatCount="indefinite" calcMode="spline" keySplines="0.2 0 0.4 1"/>
      <animate attributeName="opacity" values="0.4;0" dur="2.6s" begin="1s" repeatCount="indefinite" calcMode="spline" keySplines="0.2 0 0.4 1"/>
    </circle>
  </g>

  <!-- stack() badge -->
  <g transform="translate(940, 230)">
    <rect width="190" height="38" rx="10" fill="#0f1520" stroke="#2e3540" stroke-width="1"/>
    <text x="16" y="25" font-size="15" font-family="monospace">
      <tspan fill="#7c8796">stack(</tspan><tspan fill="#2dd4bf" font-weight="700">note</tspan><tspan fill="#7c8796">, </tspan><tspan fill="#818cf8" font-weight="700">sound</tspan><tspan fill="#7c8796">)</tspan>
    </text>
  </g>

  <!-- Bottom info line -->
  <text x="80" y="290" fill="#7c8796" font-size="13" font-family="monospace">
    <tspan fill="#9aa4b2">voices</tspan>
    <tspan fill="#2e3540"> | </tspan>
    <tspan fill="#9aa4b2">envelopes</tspan>
    <tspan fill="#2e3540"> | </tspan>
    <tspan fill="#9aa4b2">filters</tspan>
    <tspan fill="#2e3540"> | </tspan>
    <tspan fill="#9aa4b2">noise</tspan>
    <tspan fill="#2e3540">  &#x2022;  </tspan>
    <tspan fill="#7c8796">Liminal HQ</tspan>
  </text>
</svg>
